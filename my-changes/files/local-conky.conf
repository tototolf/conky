-- ============================================================
--  Conky — конфиг под этот ноутбук (ThinkPad, i5-1145G7, Manjaro XFCE/X11)
--  Файл:    ~/.config/conky/conky.conf
--  Запуск:  conky -d
--  Стоп:    pkill conky        Перезапуск: pkill conky; conky -d
--  Датчики подобраны под эту машину:
--    coretemp = температура CPU, thinkpad = кулер, nvme = SSD,
--    wlp0s20f3 = Wi-Fi, BAT0 = батарея
-- ============================================================

conky.config = {
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 48,
    update_interval = 1.0,
    double_buffer = true,

    use_xft = true,
    font = 'Hack Nerd Font:size=10',
    default_color = 'D8DEE9',
    color1 = '88C0D0',   -- подписи
    color2 = 'A3BE8C',   -- норма
    color3 = 'EBCB8B',   -- внимание
    color4 = 'BF616A',   -- критично

    own_window = true,
    own_window_type = 'normal',
    own_window_title = 'conky-system',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,   -- полупрозрачный фон (нужен композитор)
    own_window_argb_value = 150,
    own_window_colour = '808080',

    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    stippled_borders = 0,
    border_inner_margin = 8,
    border_outer_margin = 8,
    minimum_width = 300,
    maximum_width = 300,
    default_bar_height = 6,

    cpu_avg_samples = 4,
    net_avg_samples = 4,
    diskio_avg_samples = 4,
    no_buffers = true,
    text_buffer_size = 4096,
    use_spacer = 'none',
    uppercase = false,
    short_units = true,
    temperature_unit = 'celsius',
    show_graph_scale = false,
    show_graph_range = false,
    out_to_console = false,
    out_to_stderr = false,
    out_to_x = true,
    background = false,
}

conky.text = [[
${color1}${font Hack Nerd Font:bold:size=12}ThinkPad${font}${color}${alignr}${color1}${time %H:%M}${color}
${color1}${hr 2}${color}
${color1}ОС${color}     $sysname $kernel
${color1}Аптайм${color} $uptime${alignr}${time %a %d %b}

${color1}CPU${color} i5-1145G7${alignr}${color2}${cpu cpu0}%${color}
${cpubar cpu0 6,284}
${color1}Частота${color} ${freq_g 1} ГГц   ${color1}LA${color} ${loadavg 1}
${color1}Темп${color} ${if_match ${hwmon coretemp temp 1} > 80}${color4}${hwmon coretemp temp 1}°C${color}${else}${if_match ${hwmon coretemp temp 1} > 65}${color3}${hwmon coretemp temp 1}°C${color}${else}${color2}${hwmon coretemp temp 1}°C${color}${endif}${endif}   ${color1}Кулер${color} ${hwmon thinkpad fan 1} RPM   ${color1}NVMe${color} ${hwmon nvme temp 1}°C
${cpugraph cpu0 22,284 88C0D0 A3BE8C -t -l}

${color1}ОЗУ${color}  $mem / $memmax${alignr}${color2}${memperc}%${color}
${membar 6,284}
${color1}Swap${color} $swap / $swapmax${alignr}${color2}${swapperc}%${color}
${color1}Диск${color} /  ${fs_used /} / ${fs_size /}${alignr}${color2}${fs_used_perc /}%${color}
${fs_bar 6,284 /}
${color1}Диск IO${color} чтение ${diskio_read}/с   запись ${diskio_write}/с

${color1}Wi-Fi${color} ${wireless_essid wlp0s20f3}${alignr}${color2}${wireless_link_qual_perc wlp0s20f3}%${color}
${if_up wlp0s20f3}${color2}▼${color} ${downspeedf wlp0s20f3} КиБ/с   ${color4}▲${color} ${upspeedf wlp0s20f3} КиБ/с${else}${color4}нет подключения${color}${endif}
${downspeedgraph wlp0s20f3 22,284 88C0D0 BF616A -t -l}

${color1}Батарея${color} ${battery_short BAT0}
${if_match ${battery_percent BAT0} < 20}${color4}Осталось ${battery_time BAT0} — пора заряжать${color}${else}${color2}Осталось ${battery_time BAT0}${color}${endif}
${battery_bar 6,284 BAT0}

${color1}Топ по CPU${color}
${color2}${top name 1}${color} ${top cpu 1}%${alignr}${top name 2} ${top cpu 2}%
${color2}${top name 3}${color} ${top cpu 3}%${alignr}${top name 4} ${top cpu 4}%
${color1}Топ по памяти${color}
${color2}${top_mem name 1}${color} ${top_mem mem_res 1}${alignr}${top_mem name 2} ${top_mem mem_res 2}
]]
